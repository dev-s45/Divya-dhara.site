  <!-- POPUP MODAL FOR DETAILED STORY -->
  <div id="storyModal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); z-index: 9999; justify-content: center; align-items: center; padding: 20px;">
    <div style="background: linear-gradient(135deg, rgba(30, 15, 5, 0.95), rgba(18, 10, 4, 0.98)); border: 2px solid var(--border-gold); border-radius: 24px; max-width: 700px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); position: relative; animation: modalFadeIn 0.3s ease;">
      
      <!-- Close Button -->
      <button id="closeModal" style="position: absolute; top: 16px; right: 20px; background: none; border: none; color: var(--gold-light); font-size: 1.8rem; cursor: pointer;">&times;</button>

      <span id="modalCategory" style="color: var(--gold-primary); font-size: 0.8rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;"></span>
      
      <h2 id="modalTitle" style="font-family: var(--font-hindi); color: var(--gold-light); font-size: 1.7rem; margin: 10px 0 6px 0;"></h2>
      <p id="modalSubtitle" style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;"></p>

      <div id="modalParagraphs" style="margin-bottom: 20px;">
        <!-- Dynamic Paragraphs -->
      </div>

      <blockquote id="modalVerse" style="background: rgba(245, 158, 11, 0.1); border-left: 3px solid var(--gold-primary); padding: 14px 18px; border-radius: 0 12px 12px 0; font-family: var(--font-hindi); color: var(--gold-light); font-size: 1.05rem; margin-bottom: 24px;"></blockquote>

      <!-- MODAL FOOTER: SIGNATURE & SHARE BUTTONS -->

        <!-- Left Signature -->
        <span style="font-family: var(--font-hindi); color: var(--gold-primary); font-size: 0.95rem; font-style: italic; font-weight: 600;">
          — By Divya Dhara
        </span>

        <!-- Right Modern Share Buttons -->
        <div style="display: flex; gap: 10px;">
          <button id="smartShareBtn" style="background: var(--gold-gradient); color: #120a04; border: none; padding: 10px 18px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.25);">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="18" cy="5" r="3"></circle>
              <circle cx="6" cy="12" r="3"></circle>
              <circle cx="18" cy="19" r="3"></circle>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
            <span>Share Katha</span>
          </button>

          <button id="copyShareBtn" style="background: rgba(245, 158, 11, 0.12); color: var(--gold-light); border: 1px solid var(--border-gold); padding: 10px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span>Copy Link</span>
          </button>
        </div>
      </div>

    </div>

  <!-- MOBILE BOTTOM DOCK -->
  <nav class="mobile-bottom-dock" aria-label="Mobile Navigation">
    <a href="index.html" class="dock-item"><span>⌂</span><small>Home</small></a>
    <a href="darshan.html" class="dock-item"><span>🌅</span><small>Darshan</small></a>
    <a href="knowledge.html" class="dock-item"><span>🪔</span><small>Gyaan</small></a>
    <a href="thought.html" class="dock-item"><span>💡</span><small>Vichar</small></a>
    <a href="articles.html" class="dock-item active"><span>📖</span><small>Kathayein</small></a>
  </nav>

  <!-- SCRIPT LOGIC -->
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      // 1. Mobile Menu Logic
      const menuToggle = document.getElementById("menuToggle");
      const desktopNav = document.getElementById("desktopNav");
      if (menuToggle && desktopNav) {
        menuToggle.addEventListener("click", (e) => {
          e.stopPropagation();
          const isExpanded = menuToggle.getAttribute("aria-expanded") === "true";
          menuToggle.setAttribute("aria-expanded", !isExpanded);
          menuToggle.classList.toggle("active");
          desktopNav.classList.toggle("mobile-open");
        });
        document.addEventListener("click", (e) => {
          if (!menuToggle.contains(e.target) && !desktopNav.contains(e.target)) {
            menuToggle.classList.remove("active");
            desktopNav.classList.remove("mobile-open");
            menuToggle.setAttribute("aria-expanded", "false");
          }
        });
      }

      // 2. Cosmic Background Animation
      const canvas = document.getElementById("cosmicBgCanvas");
      if (canvas) {
        const ctx = canvas.getContext("2d");
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        window.addEventListener("resize", () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        });

        const particles = Array.from({ length: 60 }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 1.6 + 0.5,
          speedY: Math.random() * 0.35 + 0.1,
          speedX: Math.random() * 0.2 - 0.1,
          opacity: Math.random() * 0.7 + 0.2
        }));

        function animate() {
          ctx.clearRect(0, 0, width, height);
          particles.forEach(p => {
            p.y -= p.speedY;
            p.x += p.speedX;
            if (p.y < 0) {
              p.y = height;
              p.x = Math.random() * width;
            }
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(252, 211, 77, ${p.opacity})`;
            ctx.shadowBlur = 8;
            ctx.shadowColor = "#f59e0b";
            ctx.fill();
          });
          requestAnimationFrame(animate);
        }
        animate();
      }

      // 3. Render Stories & Filtering & Modal Logic
      const container = document.getElementById("storiesContainer");
      const tabsBox = document.getElementById("categoryTabs");
      const modal = document.getElementById("storyModal");
      const closeModal = document.getElementById("closeModal");

      let selectedStory = null;

      if (typeof contentData !== "undefined" && contentData.articlesPage) {
        const { categories, stories } = contentData.articlesPage;

        function renderStories(selectedCat = "SABHI") {
          const filtered = selectedCat === "SABHI" 
            ? stories 
            : stories.filter(s => s.category === selectedCat);

          container.innerHTML = filtered.map(item => `
            <div class="story-card" data-id="${item.id}" style="background: var(--bg-card); border: 1px solid var(--border-gold); border-radius: 20px; padding: 24px; cursor: pointer; transition: all 0.3s ease; display: flex; flex-direction: column; justify-content: space-between;">
              <div>
                <span style="color: var(--gold-primary); font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;">${item.category}</span>
                <h3 style="font-family: var(--font-hindi); color: var(--gold-light); font-size: 1.3rem; margin: 10px 0 6px 0; line-height: 1.35;">${item.title}</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem; line-height: 1.5; margin-bottom: 16px;">${item.preview}</p>
              </div>
              <span style="color: var(--gold-primary); font-size: 0.85rem; font-weight: 600;">Poori Katha Padhein ↗</span>
            </div>
          `).join('');

          // Click Events for Modal
          document.querySelectorAll('.story-card').forEach(card => {
            card.addEventListener('click', () => {
              const id = card.getAttribute('data-id');
              selectedStory = stories.find(s => s.id === id);

              if (selectedStory) {
                document.getElementById("modalCategory").innerText = selectedStory.category;
                document.getElementById("modalTitle").innerText = selectedStory.title;
                document.getElementById("modalSubtitle").innerText = selectedStory.subtitle;
                document.getElementById("modalVerse").innerText = `"${selectedStory.verse}"`;

                // Render Paragraphs
                const pContainer = document.getElementById("modalParagraphs");
                pContainer.innerHTML = selectedStory.paragraphs.map(p => `
                  <div style="margin-bottom: 16px;">
                    <h4 style="font-family: var(--font-hindi); color: var(--gold-primary); font-size: 1.1rem; margin-bottom: 4px;">✦ ${p.heading}</h4>
                    <p style="color: var(--text-main); font-size: 0.95rem; line-height: 1.6;">${p.text}</p>
                  </div>
                `).join('');

                modal.style.display = "flex";
              }
            });
          });
        }

        // Render Filter Tabs
        tabsBox.innerHTML = categories.map((cat, index) => `
          <button class="tab-btn ${index === 0 ? 'active' : ''}" data-cat="${cat}" style="background: ${index === 0 ? 'var(--gold-gradient)' : 'rgba(245, 158, 11, 0.1)'}; border: 1px solid var(--border-gold); color: ${index === 0 ? '#120a04' : 'var(--gold-light)'}; padding: 8px 16px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease;">
            ${cat}
          </button>
        `).join('');

        // Tab Click Events
        tabsBox.querySelectorAll('.tab-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            tabsBox.querySelectorAll('.tab-btn').forEach(b => {
              b.style.background = 'rgba(245, 158, 11, 0.1)';
              b.style.color = 'var(--gold-light)';
            });
            btn.style.background = 'var(--gold-gradient)';
            btn.style.color = '#120a04';

            renderStories(btn.getAttribute('data-cat'));
          });
        });

        // Close Modal
        closeModal.addEventListener('click', () => {
          modal.style.display = "none";
        });
        modal.addEventListener('click', (e) => {
          if (e.target === modal) modal.style.display = "none";
        });

        // Native Multi-App Share Logic
        document.getElementById("smartShareBtn").addEventListener("click", async () => {
          if (!selectedStory) return;

          const siteUrl = window.location.href.split('?')[0] + `?id=${selectedStory.id}`;
          const shareTitle = `Divya Dhara — ${selectedStory.title}`;
          const shareText = `🪔 Divya Dhara — Divya Katha 🪔\n\n"${selectedStory.title}"\n\n${selectedStory.preview}\n\n📖 Read full katha here: ${siteUrl}\n\n— By Divya Dhara\n`;

          if (navigator.share) {
            try {
              await navigator.share({
                title: shareTitle,
                text: shareText,
                url: siteUrl
              });
            } catch (err) {
              console.log("Share cancelled:", err);
            }
          } else {
            const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`;
            window.open(whatsappUrl, '_blank');
          }
        });

        // Copy Link Logic
        const copyBtn = document.getElementById("copyShareBtn");
        copyBtn.addEventListener("click", () => {
          if (!selectedStory) return;
          const siteUrl = window.location.href.split('?')[0] + `?id=${selectedStory.id}`;

          navigator.clipboard.writeText(siteUrl).then(() => {
            const orig = copyBtn.innerHTML;
            copyBtn.innerHTML = `
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              <span style="color: var(--gold-primary);">Copied!</span>
            `;
            setTimeout(() => { copyBtn.innerHTML = orig; }, 2000);
          });
        });

        // Initial Load
        renderStories();
      }
    });
  </script>

  <style>
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }

  </style>

  <style>#cosmicBgCanvas {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
  z-index: -1 !important; /* Background me le jane ke liye */
  pointer-events: none !important; /* Touch/Click block na ho */
  display: block !important;
}</style>
